<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cite Ranker Standalone Debugger</title>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-untar@2.0.0/build/dist/untar.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --accent: #6366f1;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }
        body { font-family: system-ui, sans-serif; padding: 40px 20px; background: radial-gradient(circle at top left, #1e293b, #0f172a); color: #f1f5f9; line-height: 1.5; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: white; text-align: center; font-weight: 800; letter-spacing: -1px; margin-bottom: 40px; }
        .section { background: var(--card-bg); backdrop-filter: blur(10px); padding: 24px; border-radius: 16px; margin-bottom: 24px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        input[type="text"] { background: #0f172a; border: 1px solid var(--border); color: white; padding: 12px 16px; border-radius: 8px; width: 250px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: var(--accent); }
        button { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
        button:hover { transform: translateY(-2px); }
        pre { background: #020617; padding: 20px; border-radius: 12px; overflow-x: auto; max-height: 400px; border: 1px solid var(--border); font-size: 13px; color: #94a3b8;}
        .log-line { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .stat { color: #818cf8; font-weight: bold; }
        .meta-card { border-radius: 12px; padding: 16px; margin: 12px 0; background: rgba(255,255,255,0.03); border: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cite Ranker Metadata Debugger</h1>
        
        <div class="section">
            <h3>Test Extraction & Parsing</h3>
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
                <input type="text" id="arxiv-id" placeholder="ArXiv ID (e.g. 2301.12345)" value="2301.12345">
                <button id="run-btn">Run Analysis</button>
            </div>
            <div id="status">Ready.</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="section">
                <h3>Execution Logs</h3>
                <div id="logs"></div>
            </div>
            <div class="section">
                <h3>Extracted Metadata (Preview)</h3>
                <div id="metadata-preview"></div>
            </div>
        </div>

        <div class="section">
            <h3>Full Metadata Object</h3>
            <pre id="json-output">{}</pre>
        </div>
    </div>

    <script>
        // CORE LOGIC COPIED FROM main.js
        function extractBibField(fieldsStr, fieldName) {
            const regex = new RegExp(`${fieldName}\\s*=\\s*(?:\{|")((?:[^{}]|\{[^{}]*\})*)(?:\}|")`, 'i');
            const match = regex.exec(fieldsStr);
            if (match) {
                return match[1].replace(/\{|\}/g, '').replace(/\s+/g, ' ').trim();
            }
            return null;
        }

        function parseBibliographyMetadata(bibContents, bblContents) {
            const metadata = {};
            bibContents.forEach(content => {
                const entryRegex = /@([a-zA-Z]+)\s*\{\s*([^,]+),([^@]*)/g;
                let match;
                while ((match = entryRegex.exec(content)) !== null) {
                    const key = match[2].trim();
                    const fieldsStr = match[3];
                    const entry = {
                        title: extractBibField(fieldsStr, 'title'),
                        authors: extractBibField(fieldsStr, 'author'),
                        venue: extractBibField(fieldsStr, 'journal') || extractBibField(fieldsStr, 'booktitle') || extractBibField(fieldsStr, 'publisher')
                    };
                    if (entry.title || entry.authors) metadata[key] = entry;
                }
            });
            bblContents.forEach(content => {
                const bibitemRegex = /\\bibitem(?:\[[^\]]*\])?\{([^}]+)\}([\s\S]*?)(?=\\bibitem|\s*\\end\{thebibliography\}|$)/g;
                let match;
                while ((match = bibitemRegex.exec(content)) !== null) {
                    const key = match[1].trim();
                    if (metadata[key]) continue;
                    const rawText = match[2].replace(/\\newblock/g, ' ').replace(/\{|\}/g, '').replace(/\\em/g, '').replace(/\s+/g, ' ').trim();
                    metadata[key] = {
                        title: 'Match from .bbl: ' + rawText.substring(0, 80) + '...',
                        authors: 'Extracted from compiled source',
                        venue: 'BBL Format'
                    };
                }
            });
            return metadata;
        }

        function log(msg, type = '') {
            const div = document.createElement('div');
            div.className = 'log-line ' + type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.getElementById('logs').prepend(div);
        }

        document.getElementById('run-btn').onclick = async () => {
            const id = document.getElementById('arxiv-id').value.trim();
            if (!id) return;

            const btn = document.getElementById('run-btn');
            btn.disabled = true;
            btn.textContent = 'Running...';
            document.getElementById('logs').innerHTML = '';
            document.getElementById('metadata-preview').innerHTML = '';
            document.getElementById('json-output').textContent = '{}';
            document.getElementById('status').textContent = 'Starting...';

            try {
                log(`Fetching source for ${id}...`);
                const response = await fetch(`https://cors-anywhere.herokuapp.com/https://arxiv.org/src/${id}`);
                // Note: using a proxy for local testing since arxiv.org blocks direct fetch from null origin
                // If it fails, we'll try direct as fallback
                let finalResponse = response;
                if (!response.ok) {
                    log(`Proxy failed, trying direct fetch (will likely fail CORS in browser)...`, 'error');
                    finalResponse = await fetch(`https://arxiv.org/src/${id}`);
                }

                if (!finalResponse.ok) throw new Error('Status ' + finalResponse.status);

                log(`Download successful (${finalResponse.status})`);
                const buffer = await finalResponse.arrayBuffer();
                const uint8 = new Uint8Array(buffer);
                
                log(`Bytes downloaded: ${buffer.byteLength}`);

                let decompressed;
                if (uint8[0] === 0x1f && uint8[1] === 0x8b) {
                    log('GZIP detected. Decompressing...');
                    decompressed = pako.ungzip(uint8);
                    log(`Decompressed size: ${decompressed.byteLength}`);
                } else {
                    decompressed = uint8;
                }

                const isTar = String.fromCharCode(...decompressed.slice(257, 262)).includes('ustar');
                log(`Is TAR archive: ${isTar}`);

                const bibFiles = [];
                const bblFiles = [];

                if (isTar) {
                    log('Extracting TAR...');
                    const extracted = await untar(decompressed.buffer);
                    log(`Found ${extracted.length} files in TAR`);
                    
                    extracted.forEach(file => {
                        const name = file.name.toLowerCase();
                        if (name.endsWith('.bib')) {
                            log(`Found BIB: ${file.name}`, 'success');
                            bibFiles.push(new TextDecoder().decode(file.buffer));
                        } else if (name.endsWith('.bbl')) {
                            log(`Found BBL: ${file.name}`, 'success');
                            bblFiles.push(new TextDecoder().decode(file.buffer));
                        }
                    });
                } else {
                    log('Single file detected (No TAR)');
                    const text = new TextDecoder().decode(decompressed);
                    log('Decoding file content...');
                }

                log('Parsing metadata...');
                const metadata = parseBibliographyMetadata(bibFiles, bblFiles);
                const keys = Object.keys(metadata);
                log(`Metadata parsed. Found ${keys.length} entries.`, 'success');

                document.getElementById('status').innerHTML = `<span class="success">Completed! Found ${keys.length} metadata entries.</span>`;
                document.getElementById('json-output').textContent = JSON.stringify(metadata, null, 2);

                if (keys.length > 0) {
                    keys.slice(0, 10).forEach(key => {
                        const entry = metadata[key];
                        const card = document.createElement('div');
                        card.className = 'meta-card';
                        card.innerHTML = `
                            <strong>Key: ${key}</strong><br>
                            <span class="stat">Title:</span> ${entry.title || 'N/A'}<br>
                            <span class="stat">Authors:</span> ${entry.authors || 'N/A'}<br>
                            <span class="stat">Venue:</span> ${entry.venue || 'N/A'}
                        `;
                        document.getElementById('metadata-preview').appendChild(card);
                    });
                    if (keys.length > 10) {
                        const more = document.createElement('div');
                        more.textContent = `... and ${keys.length - 10} more.`;
                        document.getElementById('metadata-preview').appendChild(more);
                    }
                } else {
                    document.getElementById('metadata-preview').innerHTML = '<p class="error">No entries found. Checked files but could not extract fields.</p>';
                }

            } catch (e) {
                log(`ERROR: ${e.message}`, 'error');
                document.getElementById('status').innerHTML = `<span class="error">Failed: ${e.message}</span>`;
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Run Analysis';
            }
        };
    </script>
</body>
</html>
